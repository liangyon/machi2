[project]
name = "backend"
version = "0.1.0"
description = "Arcane Depths — FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "authlib>=1.6.8",
    "bcrypt>=5.0.0",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain-core>=1.2.13",
    "langgraph>=1.0.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "sse-starlette>=3.2.0",
    "uvicorn[standard]>=0.41.0",
]


[project.scripts]
dev = "app.main:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
